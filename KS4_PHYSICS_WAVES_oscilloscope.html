<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>St James Physics Lab | Oscilloscope Simulator</title>
<style>
:root{
  --bg:#f4f6f8;
  --panel:#ffffff;
  --ink:#17202a;
  --muted:#66737f;
  --border:#d7dde3;
  --scope:#07130d;
  --grid:#204a36;
  --grid2:#3b7659;
  --trace:#9cff9c;
  --accent:#2d6cdf;
  --knob:#434b55;
  --knob-edge:#2c3238;
  --tick:#8f99a3;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--ink);
}
.app{
  max-width:1180px;
  margin:auto;
  padding:14px;
  position:relative;
}
h1{
  margin:0 0 10px;
  font-size:clamp(24px,2.5vw,34px);
}
.panel{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
  padding:12px;
}
.scope-wrap{
  background:#1a1f1c;
  border:7px solid #2d3431;
  border-radius:16px;
  overflow:hidden;
}
canvas{
  width:100%;
  aspect-ratio:10/5.4;
  display:block;
  background:var(--scope);
}
.control-strip{
  display:grid;
  grid-template-columns:repeat(4,minmax(120px,1fr)) 150px;
  gap:10px;
  align-items:end;
  margin-top:10px;
  padding-top:8px;
  border-top:1px solid var(--border);
}
.dial-cell{
  text-align:center;
  position:relative;
  padding:0 4px 2px;
}
.dial-cell:nth-child(2){
  border-right:1px solid var(--border);
}
.group-label{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.06em;
  color:var(--muted);
  font-weight:700;
  margin-bottom:2px;
  min-height:14px;
}
.dial-label{
  font-size:14px;
  font-weight:700;
  margin-bottom:3px;
}
.dial{
  width:90px;
  height:90px;
  margin:0 auto 3px;
  position:relative;
  touch-action:none;
  user-select:none;
}
.tick{
  position:absolute;
  width:18px;
  height:18px;
  left:50%;
  top:0;
  margin-left:-9px;
  transform-origin:50% 45px;
  cursor:pointer;
  border-radius:50%;
}
.tick::after{
  content:"";
  position:absolute;
  left:8px;
  top:1px;
  width:2px;
  height:8px;
  background:var(--tick);
  border-radius:2px;
}
.tick:hover::after,
.tick.active::after{
  background:#174ea6;
  width:3px;
}
.knob{
  position:absolute;
  left:14px;
  top:14px;
  width:62px;
  height:62px;
  border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#5c6671 0%,var(--knob) 50%,var(--knob-edge) 100%);
  box-shadow:
    inset 0 2px 5px rgba(255,255,255,.12),
    inset 0 -4px 7px rgba(0,0,0,.28),
    0 1px 3px rgba(0,0,0,.15);
  cursor:pointer;
}
.pointer{
  position:absolute;
  left:50%;
  top:50%;
  width:3px;
  height:24px;
  margin-left:-1.5px;
  margin-top:-24px;
  background:#fff;
  border-radius:2px;
  transform-origin:50% 24px;
}
.cap{
  position:absolute;
  width:11px;
  height:11px;
  border-radius:50%;
  left:50%;
  top:50%;
  margin-left:-5.5px;
  margin-top:-5.5px;
  background:#e9edf1;
}
.value{
  font-size:14px;
  font-weight:700;
  color:#174ea6;
  min-height:18px;
  font-variant-numeric:tabular-nums;
}
.actions{
  display:flex;
  flex-direction:column;
  gap:8px;
  justify-content:center;
  align-self:center;
}
button{
  min-height:40px;
  border:1px solid var(--border);
  border-radius:10px;
  background:#fff;
  padding:8px 12px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}
button.primary{
  background:var(--accent);
  border-color:var(--accent);
  color:#fff;
}
.note{
  margin-top:6px;
  color:var(--muted);
  font-size:12px;
  text-align:center;
}

/* Secret sound toggle: tiny, unlabelled, top-left square */
.secret-sound{
  position:absolute;
  top:4px;
  left:4px;
  width:20px;
  height:20px;
  border:1px solid #cfd5db;
  border-radius:3px;
  background:#eef1f4;
  opacity:.55;
  cursor:default;
  z-index:20;
  touch-action:manipulation;
}
.secret-sound.active{
  background:#d8eadf;
  border-color:#9ec4ac;
  opacity:.75;
}

@media(max-width:850px){
  .control-strip{
    grid-template-columns:repeat(4,1fr);
  }
  .actions{
    grid-column:1 / -1;
    flex-direction:row;
  }
}
@media(max-width:620px){
  .control-strip{grid-template-columns:repeat(2,1fr)}
  .dial-cell:nth-child(2){border-right:none}
  .actions{grid-column:1 / -1}
  .app{padding:8px}
}
</style>
</head>
<body>
<div class="app">
  <div id="secretSound" class="secret-sound" aria-hidden="true"></div>

  <div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap">
  <h1 style="margin-bottom:4px">Oscilloscope Simulator</h1>
  <div style="font-weight:700;color:#174ea6;font-size:15px;letter-spacing:.02em">ST JAMES PHYSICS LAB</div>
</div>

  <div class="panel">
    <div class="scope-wrap"><canvas id="scope"></canvas></div>

    <div class="control-strip">
      <div class="dial-cell">
        <div class="group-label">Input signal</div>
        <div class="dial-label">Frequency</div>
        <div class="dial" id="dial-frequency"></div>
        <div class="value" id="value-frequency">500 Hz</div>
      </div>

      <div class="dial-cell">
        <div class="group-label">&nbsp;</div>
        <div class="dial-label">Amplitude</div>
        <div class="dial" id="dial-amplitude"></div>
        <div class="value" id="value-amplitude">1.5 V</div>
      </div>

      <div class="dial-cell">
        <div class="group-label">Oscilloscope</div>
        <div class="dial-label">Time base</div>
        <div class="dial" id="dial-timebase"></div>
        <div class="value" id="value-timebase">1 ms/div</div>
      </div>

      <div class="dial-cell">
        <div class="group-label">&nbsp;</div>
        <div class="dial-label">Y scale</div>
        <div class="dial" id="dial-yscale"></div>
        <div class="value" id="value-yscale">1 V/div</div>
      </div>

      <div class="actions">
        <button id="pauseBtn" class="primary">Pause</button>
        <button id="resetBtn">Reset</button>
      </div>
    </div>

    <div class="note">Click a mark around any dial to select that setting. The trace drifts gently from left to right.</div>
  </div>
</div>

<script>
const canvas = document.getElementById('scope');
const ctx = canvas.getContext('2d');
const pauseBtn = document.getElementById('pauseBtn');
const resetBtn = document.getElementById('resetBtn');
const secretSound = document.getElementById('secretSound');

let running = true;
let horizontalOffset = 0;
let last = performance.now();

/* Audio */
let audioContext = null;
let oscillator = null;
let gainNode = null;
let soundOn = false;
let lastSecretTap = 0;

const state = {
  frequency: 500,
  amplitude: 1.5,
  timebase: 1,
  yscale: 1
};

const settings = {
  frequency: [50,100,200,500,1000,1500,2000],
  amplitude: [0.5,1,1.5,2,3,4,5],
  timebase: [0.1,0.2,0.5,1,2,5,10],
  yscale: [0.1,0.2,0.5,1,2,5]
};

function format(n){
  return Math.abs(n - Math.round(n)) < 1e-9 ? String(Math.round(n)) : String(Number(n.toFixed(2)));
}

function updateLabels(){
  document.getElementById('value-frequency').textContent = format(state.frequency) + ' Hz';
  document.getElementById('value-amplitude').textContent = format(state.amplitude) + ' V';
  document.getElementById('value-timebase').textContent = format(state.timebase) + ' ms/div';
  document.getElementById('value-yscale').textContent = format(state.yscale) + ' V/div';
}

function amplitudeToGain(a){
  const minA = settings.amplitude[0];
  const maxA = settings.amplitude[settings.amplitude.length - 1];
  const frac = (a - minA) / (maxA - minA);
  return 0.012 + Math.max(0,Math.min(1,frac)) * 0.07;
}

async function ensureAudio(){
  if(!audioContext){
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    oscillator = audioContext.createOscillator();
    gainNode = audioContext.createGain();

    oscillator.type = 'sine';
    oscillator.frequency.value = state.frequency;
    gainNode.gain.value = 0;

    oscillator.connect(gainNode);
    gainNode.connect(audioContext.destination);
    oscillator.start();
  }
  if(audioContext.state === 'suspended'){
    await audioContext.resume();
  }
}

function updateAudio(){
  if(!audioContext || !oscillator || !gainNode) return;
  const now = audioContext.currentTime;
  oscillator.frequency.cancelScheduledValues(now);
  oscillator.frequency.setTargetAtTime(state.frequency, now, 0.015);

  const targetGain = (soundOn && running) ? amplitudeToGain(state.amplitude) : 0;
  gainNode.gain.cancelScheduledValues(now);
  gainNode.gain.setTargetAtTime(targetGain, now, 0.02);
}

async function toggleSound(){
  await ensureAudio();
  soundOn = !soundOn;
  secretSound.classList.toggle('active', soundOn);
  updateAudio();
}

/* Double tap/double click secret square */
secretSound.addEventListener('pointerup', async () => {
  const now = performance.now();
  if(now - lastSecretTap < 450){
    lastSecretTap = 0;
    await toggleSound();
  }else{
    lastSecretTap = now;
  }
});

class ClickDial{
  constructor(id,key,values){
    this.el = document.getElementById(id);
    this.key = key;
    this.values = values;
    this.minAngle = -135;
    this.maxAngle = 135;
    this.ticks = [];
    this.render();
    this.setValue(state[key]);
  }

  render(){
    this.values.forEach((value,i)=>{
      const tick = document.createElement('div');
      tick.className = 'tick';
      const frac = this.values.length===1 ? 0 : i/(this.values.length-1);
      const angle = this.minAngle + frac*(this.maxAngle-this.minAngle);
      tick.style.transform = `rotate(${angle}deg)`;
      tick.addEventListener('click',(e)=>{
        e.stopPropagation();
        this.setValue(value);
      });
      this.el.appendChild(tick);
      this.ticks.push(tick);
    });

    const knob = document.createElement('div');
    knob.className = 'knob';
    const pointer = document.createElement('div');
    pointer.className = 'pointer';
    const cap = document.createElement('div');
    cap.className = 'cap';
    knob.appendChild(pointer);
    knob.appendChild(cap);
    this.el.appendChild(knob);
    this.pointer = pointer;

    this.el.addEventListener('click',(e)=>{
      if(e.target.closest('.tick')) return;
      const r = this.el.getBoundingClientRect();
      const cx = r.left + r.width/2;
      const cy = r.top + r.height/2;
      const dx = e.clientX - cx;
      const dy = e.clientY - cy;
      let deg = Math.atan2(dy,dx)*180/Math.PI + 90;
      while(deg > 180) deg -= 360;
      while(deg < -180) deg += 360;
      deg = Math.max(this.minAngle,Math.min(this.maxAngle,deg));
      const frac = (deg-this.minAngle)/(this.maxAngle-this.minAngle);
      const idx = Math.round(frac*(this.values.length-1));
      this.setValue(this.values[idx]);
    });

    let dragging=false,startY=0,startIndex=0;
    knob.addEventListener('pointerdown',(e)=>{
      dragging=true;
      startY=e.clientY;
      startIndex=this.values.indexOf(state[this.key]);
      knob.setPointerCapture(e.pointerId);
      e.stopPropagation();
    });
    knob.addEventListener('pointermove',(e)=>{
      if(!dragging) return;
      const dy = startY - e.clientY;
      const delta = Math.round(dy/24);
      const idx = Math.max(0,Math.min(this.values.length-1,startIndex+delta));
      this.setValue(this.values[idx]);
    });
    knob.addEventListener('pointerup',()=>dragging=false);
    knob.addEventListener('pointercancel',()=>dragging=false);
  }

  setValue(value){
    state[this.key] = value;
    const idx = this.values.indexOf(value);
    const frac = this.values.length===1 ? 0 : idx/(this.values.length-1);
    const angle = this.minAngle + frac*(this.maxAngle-this.minAngle);
    this.pointer.style.transform = `rotate(${angle}deg)`;
    this.ticks.forEach((t,i)=>t.classList.toggle('active',i===idx));
    updateLabels();

    if(this.key === 'frequency' || this.key === 'amplitude'){
      updateAudio();
    }
  }
}

const freqDial = new ClickDial('dial-frequency','frequency',settings.frequency);
const ampDial = new ClickDial('dial-amplitude','amplitude',settings.amplitude);
const timeDial = new ClickDial('dial-timebase','timebase',settings.timebase);
const yDial = new ClickDial('dial-yscale','yscale',settings.yscale);

function resize(){
  const r = canvas.getBoundingClientRect();
  const dpr = Math.max(1,window.devicePixelRatio||1);
  canvas.width = Math.round(r.width*dpr);
  canvas.height = Math.round(r.height*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}

function drawGrid(w,h){
  ctx.fillStyle='#07130d';
  ctx.fillRect(0,0,w,h);
  const dx=w/10,dy=h/8;

  ctx.lineWidth=1;
  ctx.strokeStyle='#204a36';
  for(let i=0;i<=10;i++){
    ctx.beginPath(); ctx.moveTo(i*dx,0); ctx.lineTo(i*dx,h); ctx.stroke();
  }
  for(let j=0;j<=8;j++){
    ctx.beginPath(); ctx.moveTo(0,j*dy); ctx.lineTo(w,j*dy); ctx.stroke();
  }

  ctx.lineWidth=1.7;
  ctx.strokeStyle='#3b7659';
  ctx.beginPath(); ctx.moveTo(w/2,0); ctx.lineTo(w/2,h); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,h/2); ctx.lineTo(w,h/2); ctx.stroke();
}

function drawTrace(w,h){
  const f=state.frequency;
  const A=state.amplitude;
  const ms=state.timebase;
  const vdiv=state.yscale;

  const total=(10*ms)/1000;
  const dy=h/8;
  const ampPx=(A/vdiv)*dy;
  const cy=h/2;

  ctx.save();
  ctx.beginPath();
  ctx.rect(0,0,w,h);
  ctx.clip();

  ctx.strokeStyle='#9cff9c';
  ctx.lineWidth=2.4;
  ctx.shadowColor='#9cff9c';
  ctx.shadowBlur=5;

  ctx.beginPath();
  const samples=Math.max(700,Math.floor(w*1.5));
  for(let i=0;i<=samples;i++){
    const x=i/samples*w;
    const t=i/samples*total - horizontalOffset; // left -> right drift
    const y=cy-ampPx*Math.sin(2*Math.PI*f*t);
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.stroke();
  ctx.restore();
}

function animate(now){
  const dt=(now-last)/1000;
  last=now;

  if(running){
    horizontalOffset += dt*0.0005;
  }

  const r=canvas.getBoundingClientRect();
  drawGrid(r.width,r.height);
  drawTrace(r.width,r.height);
  requestAnimationFrame(animate);
}

pauseBtn.onclick=()=>{
  running=!running;
  pauseBtn.textContent=running?'Pause':'Run';

  // If the hidden sound switch is enabled, Pause mutes the tone
  // and Run restores it.
  if(audioContext && oscillator && gainNode && soundOn){
    const now = audioContext.currentTime;
    gainNode.gain.cancelScheduledValues(now);
    const target = running ? amplitudeToGain(state.amplitude) : 0;
    gainNode.gain.setTargetAtTime(target, now, 0.02);
  }
};

resetBtn.onclick=()=>{
  freqDial.setValue(500);
  ampDial.setValue(1.5);
  timeDial.setValue(1);
  yDial.setValue(1);
  horizontalOffset=0;
  running=true;
  pauseBtn.textContent='Pause';
  updateAudio();
};

/* Stop sound if the page is hidden */
document.addEventListener('visibilitychange',()=>{
  if(document.hidden && soundOn){
    soundOn=false;
    secretSound.classList.remove('active');
    updateAudio();
  }
});

window.addEventListener('resize',resize);
updateLabels();
resize();
requestAnimationFrame(animate);
</script>
</body>
</html>
