<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>St James Physics Lab</title>
<style>
:root{--navy:#173f73;--bg:#f4f6f8;--card:#fff;--text:#1f2937;--muted:#6b7280;--border:#dbe2ea}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
header{background:var(--navy);color:#fff;padding:28px 20px}.wrap{max-width:1100px;margin:auto}h1{margin:0;font-size:clamp(1.9rem,4vw,2.7rem)}.subtitle{margin-top:7px;opacity:.9}
main{max-width:1100px;margin:auto;padding:28px 20px 50px}#search{width:100%;max-width:520px;padding:12px 14px;border:1px solid var(--border);border-radius:9px;font-size:1rem;margin-bottom:28px}
.subject{margin-bottom:40px}.subject>h2{font-size:1.8rem;margin:0 0 20px;border-bottom:3px solid var(--navy);padding-bottom:7px}.stage{margin:24px 0 32px}.stage>h3{font-size:1.35rem;margin:0 0 15px}.topic{margin:18px 0 26px}.topic>h4{margin:0 0 11px;color:var(--muted);font-size:1.02rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:14px}.card{display:block;background:var(--card);border:1px solid var(--border);border-radius:11px;padding:16px;text-decoration:none;color:inherit;box-shadow:0 2px 5px #0000000d;transition:.15s}.card:hover{transform:translateY(-2px);box-shadow:0 5px 13px #00000018}.title{font-weight:700;font-size:1.05rem}.file{font-size:.76rem;color:var(--muted);margin-top:7px;word-break:break-all}.status{background:#fff;border:1px solid var(--border);border-radius:9px;padding:16px;color:var(--muted)}.hidden{display:none!important}footer{text-align:center;color:var(--muted);font-size:.85rem;padding:25px}
</style>
</head>
<body>
<header><div class="wrap"><h1>St James Physics Lab</h1><div class="subtitle">Interactive Physics and Maths resources</div></div></header>
<main>
<input id="search" type="search" placeholder="Search apps…" aria-label="Search apps">
<div id="status" class="status">Loading apps from GitHub…</div>
<div id="apps"></div>
</main>
<footer>St James Physics Lab</footer>
<script>
/*
Preferred filenames:
  KS3_PHYSICS_balanced_forces.html
  KS4_PHYSICS_WAVES_ripple_tank.html
  KS3_MATHS_indices_rules.html
  KS4_MATHS_SURDS_double_brackets.html

If the third section is ALL CAPS it is treated as a topic.
Otherwise everything after the subject becomes the app title.
*/
const owner='Mr-Byrne-St-James';
const repo='st-james-physics-lab';
const branch='main';
const api=`https://api.github.com/repos/${owner}/${repo}/git/trees/${branch}?recursive=1`;
const subjectOrder=['Physics','Maths','Other'];
const stageOrder=['KS3','KS4','KS5','Other'];
function nice(s){return s.replace(/[_-]+/g,' ').replace(/\s+/g,' ').trim().toLowerCase().replace(/\b\w/g,c=>c.toUpperCase())}
function parse(path){
 const filename=path.split('/').pop();
 if(!filename.toLowerCase().endsWith('.html')||filename.toLowerCase()==='index.html')return null;
 const stem=filename.replace(/\.html$/i,'');
 const p=stem.split('_');
 if(p.length>=3&&/^KS[345]$/i.test(p[0])&&/^(PHYSICS|MATHS)$/i.test(p[1])){
   const stage=p[0].toUpperCase();
   const subject=p[1].toUpperCase()==='PHYSICS'?'Physics':'Maths';
   let topic='Resources',titleParts=p.slice(2);
   if(p.length>=4&&p[2]===p[2].toUpperCase()&&/[A-Z]/.test(p[2])){topic=nice(p[2]);titleParts=p.slice(3)}
   return{path,filename,stage,subject,topic,title:nice(titleParts.join('_'))};
 }
 const short=stem.match(/^(KS[345])([PM])_([^_]+)_(.+)$/i);
 if(short){return{path,filename,stage:short[1].toUpperCase(),subject:short[2].toUpperCase()==='P'?'Physics':'Maths',topic:nice(short[3]),title:nice(short[4])}}
 return{path,filename,stage:'Other',subject:'Other',topic:'Uncategorised',title:nice(stem)};
}
function sortIndex(value,list){const i=list.indexOf(value);return i<0?999:i}
function card(app){const a=document.createElement('a');a.className='card';a.href='./'+app.path;a.dataset.search=[app.title,app.topic,app.subject,app.stage,app.filename].join(' ').toLowerCase();a.innerHTML=`<div class="title">${app.title}</div><div class="file">${app.filename}</div>`;return a}
function render(list){
 const root=document.getElementById('apps'),status=document.getElementById('status');root.innerHTML='';
 if(!list.length){status.textContent='No HTML apps found.';return}status.classList.add('hidden');
 const g={};for(const a of list){g[a.subject]??={};g[a.subject][a.stage]??={};g[a.subject][a.stage][a.topic]??=[];g[a.subject][a.stage][a.topic].push(a)}
 Object.keys(g).sort((a,b)=>sortIndex(a,subjectOrder)-sortIndex(b,subjectOrder)).forEach(subject=>{
   const ss=document.createElement('section');ss.className='subject';ss.innerHTML=`<h2>${subject}</h2>`;
   Object.keys(g[subject]).sort((a,b)=>sortIndex(a,stageOrder)-sortIndex(b,stageOrder)).forEach(stage=>{
     const st=document.createElement('section');st.className='stage';st.innerHTML=`<h3>${stage}</h3>`;
     Object.keys(g[subject][stage]).sort((a,b)=>a.localeCompare(b)).forEach(topic=>{
       const t=document.createElement('section');t.className='topic';if(topic!=='Resources')t.innerHTML=`<h4>${topic}</h4>`;
       const grid=document.createElement('div');grid.className='grid';g[subject][stage][topic].sort((a,b)=>a.title.localeCompare(b.title)).forEach(a=>grid.appendChild(card(a)));t.appendChild(grid);st.appendChild(t)
     });ss.appendChild(st)
   });root.appendChild(ss)
 });
}
function searchSetup(){document.getElementById('search').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();document.querySelectorAll('.card').forEach(c=>c.classList.toggle('hidden',q&&!c.dataset.search.includes(q)));document.querySelectorAll('.topic').forEach(x=>x.classList.toggle('hidden',!x.querySelector('.card:not(.hidden)')));document.querySelectorAll('.stage').forEach(x=>x.classList.toggle('hidden',!x.querySelector('.topic:not(.hidden)')));document.querySelectorAll('.subject').forEach(x=>x.classList.toggle('hidden',!x.querySelector('.stage:not(.hidden)')))} )}
async function load(){try{const r=await fetch(api);if(!r.ok)throw new Error(r.status);const d=await r.json();const apps=d.tree.filter(x=>x.type==='blob'&&x.path.toLowerCase().endsWith('.html')).map(x=>parse(x.path)).filter(Boolean);render(apps);searchSetup()}catch(e){console.error(e);document.getElementById('status').innerHTML='<strong>Unable to load apps from GitHub.</strong><br>Please refresh the page or check the repository settings.'}}
load();
</script>
</body>
</html>
